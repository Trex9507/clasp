packages:
  - "apps/*"
  - "packages/*"

# Dependency build scripts are denied unless listed here.
# esbuild (used by tsx and vitest) validates its native binary on install.
# cpu-features, protobufjs and ssh2 are optional native speedups pulled in by testcontainers.
allowBuilds:
  esbuild: true
  # Its postinstall only re-downloads the optional `bt` CLI binary; evals call Eval() in code.
  braintrust: false
  cpu-features: false
  protobufjs: false
  ssh2: false
