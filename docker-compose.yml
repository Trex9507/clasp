# Local Postgres for apps/api. Host port 5433 so it can run next to other local Postgres
# instances (for example Sentinel's on 5432).
services:
  postgres:
    image: postgres:16-alpine
    container_name: clasp-postgres
    environment:
      POSTGRES_USER: clasp
      POSTGRES_PASSWORD: clasp
      POSTGRES_DB: clasp
    ports:
      - "5433:5432"
    volumes:
      - clasp_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clasp -d clasp"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  clasp_pgdata:
